name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # pretest compiles with tsc and runs eslint before the tests
      - name: Lint, type-check and test
        run: npm test

  package:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # vsce package runs vscode:prepublish (Swagger UI copy + production bundle)
      - name: Package extension
        run: npx vsce package --out jsdoc-swagger-smartfold.vsix

      - name: List package contents
        run: npx vsce ls

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: jsdoc-swagger-smartfold.vsix
          retention-days: 7
